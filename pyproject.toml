[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgecompression-benchmark-2026"
version = "0.43.6.4"
description = "Edge compression benchmark and R-D-E router tooling."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.scripts]
rde-router = "src.router.rde_router:main"
rde-external-codec-probe = "src.router.codecs.external_codec_probe:main"
rde-external-codec-dry-run = "src.router.codecs.external_codec_dry_run:main"
rde-external-codec-benchmark = "src.router.codecs.external_codec_benchmark:main"
rde-external-codec-export = "src.router.codecs.external_codec_rde_exporter:main"
rde-legacy-import-audit = "src.router.observability.legacy_import_audit:main"
rde-decision-explain = "src.router.observability.decision_explanation:main"

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true
