[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgecompression-benchmark-2026"
version = "0.46.4"
description = "Edge compression benchmark and R-D-E router tooling."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "Pillow",
]

[project.scripts]
rde-router = "src.router.rde_router:main"
rde-external-codec-probe = "src.router.codecs.external_codec_probe:main"
rde-external-codec-dry-run = "src.router.codecs.external_codec_dry_run:main"
rde-external-codec-benchmark = "src.router.codecs.external_codec_benchmark:main"
rde-external-codec-export = "src.router.codecs.external_codec_rde_exporter:main"
rde-legacy-import-audit = "src.router.observability.legacy_import_audit:main"
rde-decision-explain = "src.router.observability.decision_explanation:main"
rde-domain-spec = "src.router.core.domain_spec:main"
rde-dataset-manifest = "src.router.core.dataset_manifest:main"
rde-dataset-ingest = "src.router.core.dataset_ingestion:main"
rde-dataset-onboard = "src.router.core.dataset_onboarding:main"
rde-codec-onboard = "src.router.core.codec_onboarding:main"

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest"]
# Self-contained image mini-benchmark stack: enough to produce a router-ready
# CSV on Kodak with the numpy-only PSNR metric or the SSIMULACRA2 metric
# (JPEG/JPEG XL via imagecodecs). ssimulacra2 is a small pure-Python wheel
# (numpy/pillow/scipy). It intentionally does not pull torch (DCAE) or
# ffmpeg/cjxl system binaries; those remain optional and degrade gracefully.
benchmark = [
    "numpy",
    "imagecodecs",
    "matplotlib",
    "ssimulacra2",
]
# Opt-in HEVC support without a system ffmpeg. imageio-ffmpeg ships an ffmpeg
# binary (built with libx265) as a pip wheel, so HEVC works cross-platform with
# no admin / system package. Kept out of the default `benchmark` extra because
# that ffmpeg build is GPL (via x265); install it explicitly when you want HEVC:
#   pip install -e ".[benchmark,benchmark-hevc]"
# It is used as a separate subprocess (arm's-length), not linked into this code.
benchmark-hevc = [
    "imageio-ffmpeg",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true
