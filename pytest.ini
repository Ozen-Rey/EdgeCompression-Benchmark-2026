[pytest]
testpaths = tests
norecursedirs =
    .git
    .venv
    venv
    env
    build
    dist
    _tmp
    __pycache__
    .pytest_cache
    .pytest_tmp*
    .tmp*
    .test_tmp
    pytest_tmp*
    pytest_tmp_manifest*
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -p no:cacheprovider
